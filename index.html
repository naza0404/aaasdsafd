
<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <title>Platforma ZaĹ‚adunku i RozĹ‚adunku</title>
  <style>
    body { font-family: Arial, sans-serif; }
    table { width: 100%; border-collapse: collapse; margin-bottom: 20px; }
    th, td { border: 1px solid #ccc; padding: 6px; text-align: center; }
    .pilne { background-color: #ffe6e6; }
    .zielone { background-color: #a5f3a1 !important; font-weight: bold; }
    .purpurowe { background-color: #e0aaff !important; font-weight: bold; }
    textarea { width: 100%; height: 100px; resize: vertical; }
    input[list], input[type="text"], input[type="number"], select { width: 100%; }
    input[type="number"] { max-width: 80px; }
    #map { height: 500px; margin-top: 30px; }
  </style>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.3/dist/leaflet.css" />
</head>
<body>
  <h1>Platforma ZaĹ‚adunku i RozĹ‚adunku</h1>
  <button onclick="dodajWiersz()">âž• Dodaj nowy wiersz</button>
  <datalist id="lokalizacje"></datalist>

  <table id="tabela">
    <thead>
      <tr>
        <th>PILNE</th>
        <th>ZaĹ‚adunek</th>
        <th>Data zaĹ‚adunku</th>
        <th>RozĹ‚adunek</th>
        <th>Data rozĹ‚adunku</th>
        <th>SposĂłb zaĹ‚adunku</th>
        <th>Uwagi</th>
        <th>Stawka</th>
        <th>Kilometry</th>
        <th>Stawka z km</th>
        <th>Akcja</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>

  <div id="map"></div>
  <script src="https://unpkg.com/leaflet@1.9.3/dist/leaflet.js"></script>
  <script>
    const map = L.map('map').setView([52.2297, 21.0122], 6);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: 'Â© OpenStreetMap',
      maxZoom: 18
    }).addTo(map);

    function dodajWiersz() {
      const tabela = document.querySelector("#tabela tbody");
      const wiersz = tabela.insertRow();
      wiersz.innerHTML = \`
        <td><input type="checkbox" onchange="sortujPilneNaTopie()"></td>
        <td><input type="text" list="lokalizacje"></td>
        <td><input type="date"></td>
        <td><input type="text" list="lokalizacje"></td>
        <td><input type="date"></td>
        <td>
          <select>
            <option value="tylem">TyĹ‚em</option>
            <option value="bokiem">Bokiem</option>
            <option value="gora">GĂłrÄ…</option>
          </select>
        </td>
        <td><textarea></textarea></td>
        <td><input type="number" step="0.00001" onchange="obliczStawke(this)"></td>
        <td><input type="number" step="0.00001" onchange="obliczStawke(this)"></td>
        <td><input type="text" readonly></td>
        <td><button onclick="this.closest('tr').remove()">đź—‘ď¸Ź UsuĹ„</button></td>
      \`;
    }

    function obliczStawke(input) {
      const row = input.closest("tr");
      const stawka = parseFloat(row.cells[7].querySelector("input").value);
      const km = parseFloat(row.cells[8].querySelector("input").value);
      const cell = row.cells[9].querySelector("input");
      if (!isNaN(stawka) && !isNaN(km) && km > 0) {
        const wynik = stawka / km;
        cell.value = wynik.toFixed(5);
        row.classList.remove("zielone", "purpurowe");
        if (wynik >= 3 && wynik <= 4.5) row.classList.add("zielone");
        else if (wynik > 4.5) row.classList.add("purpurowe");
      } else {
        cell.value = "";
        row.classList.remove("zielone", "purpurowe");
      }
    }

    function sortujPilneNaTopie() {
      const tbody = document.querySelector("tbody");
      const rows = Array.from(tbody.querySelectorAll("tr"));
      rows.sort((a, b) => {
        const aPilne = a.cells[0].querySelector("input").checked ? -1 : 1;
        const bPilne = b.cells[0].querySelector("input").checked ? -1 : 1;
        return aPilne - bPilne;
      });
      rows.forEach(row => tbody.appendChild(row));
    }
  </script>
</body>
</html>
